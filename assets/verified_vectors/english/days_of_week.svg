<svg xmlns="http://www.w3.org/2000/svg" width="720" height="520" viewBox="0 0 720 520" role="img" aria-labelledby="title desc">
  <title id="title">Days of the week in English</title>
  <desc id="desc">Monday, Tuesday, Wednesday, Thursday, Friday, Saturday, Sunday in order.</desc>
  <g font-family="Arial, sans-serif" fill="currentColor">
    <text x="30" y="44" font-size="30">Days of the week</text>
    <g font-size="28">
      <text x="70" y="105">Monday</text>
      <text x="70" y="160">Tuesday</text>
      <text x="70" y="215">Wednesday</text>
      <text x="70" y="270">Thursday</text>
      <text x="70" y="325">Friday</text>
      <text x="70" y="380">Saturday</text>
      <text x="70" y="435">Sunday</text>
    </g>
  </g>
</svg>