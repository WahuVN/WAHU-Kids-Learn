<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc">
  <title id="title">Các hình và đối tượng hình học trực quan lớp 2</title>
  <desc id="desc">Điểm, đoạn thẳng, đường cong, đường thẳng, đường gấp khúc, ba điểm thẳng hàng, hình tứ giác, khối trụ và khối cầu.</desc>
  <g font-family="Arial, sans-serif" fill="currentColor" stroke="currentColor">
    <text x="30" y="40" font-size="30" stroke="none">Hình học trực quan — Lớp 2</text>

    <circle cx="90" cy="120" r="6"/><text x="90" y="155" font-size="20" text-anchor="middle" stroke="none">Điểm</text>

    <line x1="210" y1="120" x2="330" y2="120" stroke-width="4"/><circle cx="210" cy="120" r="5"/><circle cx="330" cy="120" r="5"/><text x="270" y="155" font-size="20" text-anchor="middle" stroke="none">Đoạn thẳng</text>

    <path d="M420 135 C455 80, 510 170, 555 110" fill="none" stroke-width="4"/><text x="490" y="175" font-size="20" text-anchor="middle" stroke="none">Đường cong</text>

    <line x1="650" y1="120" x2="820" y2="120" stroke-width="4"/><path d="M650 120 l18 -9 v18 z M820 120 l-18 -9 v18 z"/><text x="735" y="155" font-size="20" text-anchor="middle" stroke="none">Đường thẳng</text>

    <polyline points="80,300 150,245 225,315 300,250" fill="none" stroke-width="4"/><text x="190" y="350" font-size="20" text-anchor="middle" stroke="none">Đường gấp khúc</text>

    <line x1="390" y1="280" x2="590" y2="280" stroke-width="3"/><circle cx="410" cy="280" r="6"/><circle cx="490" cy="280" r="6"/><circle cx="570" cy="280" r="6"/><text x="490" y="325" font-size="20" text-anchor="middle" stroke="none">Ba điểm thẳng hàng</text>

    <polygon points="690,230 835,250 800,340 665,315" fill="none" stroke-width="4"/><text x="750" y="375" font-size="20" text-anchor="middle" stroke="none">Hình tứ giác</text>

    <g transform="translate(150 455)"><ellipse cx="0" cy="0" rx="65" ry="20" fill="none" stroke-width="4"/><line x1="-65" y1="0" x2="-65" y2="100" stroke-width="4"/><line x1="65" y1="0" x2="65" y2="100" stroke-width="4"/><ellipse cx="0" cy="100" rx="65" ry="20" fill="none" stroke-width="4"/><text x="0" y="145" font-size="20" text-anchor="middle" stroke="none">Khối trụ</text></g>

    <g transform="translate(490 505)"><circle cx="0" cy="0" r="70" fill="none" stroke-width="4"/><ellipse cx="0" cy="0" rx="70" ry="22" fill="none" stroke-width="2" stroke-dasharray="7 6"/><path d="M-38 -58 C-8 -20 -8 20 -38 58 M38 -58 C8 -20 8 20 38 58" fill="none" stroke-width="2"/><text x="0" y="105" font-size="20" text-anchor="middle" stroke="none">Khối cầu</text></g>
  </g>
</svg>